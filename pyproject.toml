[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-case"
version = "0.1.0"
description = "iFood data engineering case — NYC Yellow Taxi pipeline on Databricks Free Edition"
requires-python = ">=3.11"
authors = [{ name = "Marcos Ribeiro Filho" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
# dbt-databricks is the local CLI dependency for the modelling side
# (ADR-0010 / ticket #07). Pinned compatible with the runtime version
# resolved by the ``dbt_task`` serverless environment in probe B
# (dbt-databricks 1.12.0, ADR-0010 §Validação empírica). Kept as an
# extra so plain ``uv sync`` for the ingestion side does not pull dbt.
dbt = [
  "dbt-databricks>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"ingestion/tests/**" = ["B011"]  # allow assert False in tests

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["ingestion/tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
