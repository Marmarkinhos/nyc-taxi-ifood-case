name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------------------------------
  # Python: lint + type-check + unit tests on the pure helpers.
  # -------------------------------------------------------------------------
  python:
    name: python (lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (strict, src/ only)
        run: mypy src/

      - name: Pytest (unit, no Spark)
        run: pytest ingestion/tests/ -ra --cov=nyc_taxi_case --cov-report=term-missing

  # -------------------------------------------------------------------------
  # NOTE: there is intentionally no `databricks bundle validate` job here.
  #
  # `bundle validate` always calls /api/2.0/preview/scim/v2/Me (to resolve
  # ${workspace.current_user.short_name} for mode: development, and to
  # fetch host metadata in any mode) and therefore requires a real
  # workspace PAT. Free Edition does not support service principals
  # (CONTEXT.md "NÃO-objetivos": NÃO fazer deploy via CI), so wiring a
  # rotating personal token into GH secrets just to run validate is not
  # worth the operational cost for a solo case repo.
  #
  # The local dev loop covers DAB validation explicitly:
  #   databricks --profile free-edition bundle validate --target user_dev
  # See the dev quickstart in README.md before any DAB change is pushed.
  # -------------------------------------------------------------------------
