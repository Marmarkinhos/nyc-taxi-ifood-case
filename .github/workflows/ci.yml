name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------------------------------
  # Python: lint + type-check + unit tests on the pure helpers.
  # -------------------------------------------------------------------------
  python:
    name: python (lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (strict, src/ only)
        run: mypy src/

      - name: Pytest (unit, no Spark)
        run: pytest ingestion/tests/ -ra --cov=nyc_taxi_case --cov-report=term-missing

  # -------------------------------------------------------------------------
  # Databricks: schema-validate the bundle WITHOUT deploying.
  #
  # `bundle validate` only checks YAML schema + variable resolution and
  # does not need a real workspace credential, but the CLI does require
  # *some* auth env vars before it will run. We feed it dummy values:
  # Free Edition cannot deploy via service principal anyway (CONTEXT.md
  # NÃO-objetivos), so a deploy job has no place in CI.
  # -------------------------------------------------------------------------
  bundle:
    name: databricks bundle validate
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: https://dbc-stub.cloud.databricks.com
      DATABRICKS_TOKEN: dapi-ci-stub-not-a-real-token
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh \
            | sh

      - name: Validate user_dev target
        run: databricks bundle validate --target user_dev
