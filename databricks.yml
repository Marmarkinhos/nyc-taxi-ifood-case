# databricks.yml — monorepo root bundle.
#
# Two independent DAB jobs live under `resources/`:
#   - job_ingestion (DLT + Auto Loader): landing -> bronze -> silver
#   - job_dbt       (dbt-databricks):    silver  -> gold + analyses
#
# They do NOT declare cross-job depends_on. Contract between them is
# `dbt/models/sources.yml` pointing at the Silver canonical table.
# See ADR-0011.
#
# Schedules are paused in every target. Execution is manual:
#   databricks bundle run job_ingestion --profile free-edition
#   databricks bundle run job_dbt       --profile free-edition
#
# `databricks bundle validate` works offline (schema check only); deploy
# requires a real workspace + PAT (Free Edition: no service principal).

bundle:
  name: nyc-taxi-case

# ---------------------------------------------------------------------------
# Local Python wheel artifact
# ---------------------------------------------------------------------------
# `ingestion/landing.py`, `ingestion/dlt_pipeline.py` and `ingestion/
# update_audit*.py` import `nyc_taxi_case.*` from `src/`. On serverless
# compute the local package is not on sys.path by default, so the bundle
# must build it as a wheel and ship it as a job/pipeline dependency.
# `databricks bundle deploy` invokes the `build` command below, then
# uploads the resulting wheel to ${workspace.artifact_path}/.internal/
# (the default location). The wheel is then referenced from the job /
# pipeline `environments` blocks via ${workspaces.artifact_path}/...
# (substituted by the bundle at deploy time).
artifacts:
  nyc_taxi_case_wheel:
    type: whl
    # `uv build --wheel` is faster than `python -m build` and is the
    # tool already used by `pyproject.toml`'s [build-system]. Drops the
    # wheel under ./dist/ (gitignored).
    build: uv build --wheel
    path: .

include:
  - resources/*.yml

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
targets:

  # Personal dev target on the Free Edition workspace. Default for
  # `bundle run` / `bundle deploy` so a stray invocation hits dev, not
  # a hypothetical production.
  user_dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-88968762-8346.cloud.databricks.com
    variables:
      # Free Edition has a single MANAGED catalog called `workspace`.
      catalog: workspace
      # Personal prefix keeps schemas scoped per user when multiple
      # devs share one catalog. Empty here because the Free Edition
      # workspace is single-tenant; left wired so the lever exists.
      catalog_prefix: ""
      # Serverless Starter Warehouse auto-provisioned by the Free
      # Edition workspace (captured 2026-06-09 via SQL Warehouses UI ->
      # Connection details). Used by job_ingestion.update_audit_task.
      sql_warehouse_id: "10ba36a843e45ac1"

  # Placeholder shape for a hypothetical production deployment. Kept
  # so `bundle validate --target prod` exercises the target wiring;
  # NOT used at runtime (Free Edition cannot deploy via SP anyway).
  prod:
    mode: production
    workspace:
      host: https://example-prod.cloud.databricks.com
    variables:
      catalog: workspace
      catalog_prefix: ""
      # No real prod workspace; placeholder kept so `bundle validate
      # --target prod` still resolves the variable.
      sql_warehouse_id: ""
