# databricks.yml — monorepo root bundle.
#
# Two independent DAB jobs live under `resources/`:
#   - job_ingestion (DLT + Auto Loader): landing -> bronze -> silver
#   - job_dbt       (dbt-databricks):    silver  -> gold views
#
# They do NOT declare cross-job depends_on. Contract between them is
# `dbt/models/sources.yml` pointing at the Silver canonical table.
# See ADR-0011.
#
# Schedules are paused in every target. Execution is manual; profile
# name is whatever the operator chose in ~/.databrickscfg (the CLI
# resolves workspace.host from that profile):
#   export BUNDLE_VAR_sql_warehouse_id=<id>
#   databricks bundle run job_ingestion --target user_dev --profile <name>
#   databricks bundle run job_dbt       --target user_dev --profile <name>
#
# `databricks bundle validate` works offline (schema check only); deploy
# requires a real workspace + PAT (Free Edition: no service principal).

bundle:
  name: nyc-taxi-case

# ---------------------------------------------------------------------------
# Local Python wheel artifact
# ---------------------------------------------------------------------------
# `ingestion/landing.py` and `ingestion/dlt_pipeline.py` import
# `nyc_taxi_case.*` from `src/`. On serverless compute the local
# package is not on sys.path by default, so the bundle must build it
# as a wheel and ship it as a job/pipeline dependency.
# `databricks bundle deploy` invokes the `build` command below, then
# uploads the resulting wheel to ${workspace.artifact_path}/.internal/
# (the default DAB destination for `type: whl` artifacts — distinct
# from ${workspace.file_path}, where `sync.include` source files land).
# The wheel is then referenced from the job / pipeline `environments`
# blocks via ${workspace.artifact_path}/.internal/<wheel-name>.whl —
# see resources/job_ingestion.yml and resources/dlt_pipeline.yml.
artifacts:
  nyc_taxi_case_wheel:
    type: whl
    # `uv build --wheel` is faster than `python -m build` and is the
    # tool already used by `pyproject.toml`'s [build-system]. Drops the
    # wheel under ./dist/ (gitignored).
    build: uv build --wheel
    path: .

include:
  - resources/*.yml

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
targets:

  # Personal dev target deployed under the operator's own user (PAT
  # in ~/.databrickscfg), as opposed to `prod` which is shaped for
  # service-principal CI deploys. Default for `bundle run` /
  # `bundle deploy` so a stray invocation hits dev, not a hypothetical
  # production. Free Edition always lands here (no SP support).
  #
  # `workspace.host` is intentionally NOT declared: the Databricks CLI
  # resolves the host from the profile passed via `--profile <name>`
  # (which reads `host = ...` from ~/.databrickscfg). This keeps the
  # bundle portable across Free Edition tenants — a third party clones
  # the repo, points their own profile at their own workspace, runs
  # `bundle deploy --profile <theirs>`, no YAML edit required.
  user_dev:
    mode: development
    default: true
    variables:
      # Free Edition has a single MANAGED catalog called `workspace`.
      catalog: workspace
      # Personal prefix keeps schemas scoped per user when multiple
      # devs share one catalog. Empty here because the Free Edition
      # workspace is single-tenant; left wired so the lever exists.
      catalog_prefix: ""
      # Warehouse id varies per Free Edition tenant — no default so
      # the bundle fails fast and clearly if the operator forgets to
      # pass it. Discover yours via:
      #   databricks warehouses list --profile <your-profile>
      # then pass it at deploy/run time, e.g.:
      #   export BUNDLE_VAR_sql_warehouse_id=<id>
      # Used by job_ingestion.update_audit_task.
      sql_warehouse_id:
        description: "SQL warehouse id. See `databricks warehouses list`."

  # Placeholder shape for a hypothetical production deployment. Kept
  # so `bundle validate --target prod` exercises the target wiring;
  # NOT used at runtime (Free Edition cannot deploy via SP anyway).
  prod:
    mode: production
    workspace:
      host: https://example-prod.cloud.databricks.com
    variables:
      catalog: workspace
      catalog_prefix: ""
      # No real prod workspace; placeholder kept so `bundle validate
      # --target prod` still resolves the variable.
      sql_warehouse_id: ""
